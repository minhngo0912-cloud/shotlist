<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shot List</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shot List">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#efeeea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1b1e" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: header and view switch, one row of filters, a tabbed subway-sign card, and a fixed action bar within thumb reach. */
:root{
  --bg:#efeeea; --panel:#ffffff; --fg:#15161a; --muted:#5d6068; --line:#cfcdc6;
  --sign:#111214; --sign-fg:#ffffff; --sign-muted:#b4b6bc; --sign-line:#3a3c42;
  --blue:#2463d9; --red:#ee352e; --orange:#ff6319; --purple:#b933ad; --yellow:#fccc0a;
  --green:#00933c; --brown:#996633; --gray:#808183; --on-yellow:#111214; --on-color:#ffffff;
  --sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1a1b1e; --panel:#24262a; --fg:#f2f2f0; --muted:#a3a6ad; --line:#3b3d43;
  --sign:#000000; --sign-fg:#ffffff; --sign-muted:#b4b6bc; --sign-line:#3a3c42; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1a1b1e; --panel:#24262a; --fg:#f2f2f0; --muted:#a3a6ad; --line:#3b3d43;
  --sign:#000000; --sign-fg:#ffffff; --sign-muted:#b4b6bc; --sign-line:#3a3c42; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,select{font-family:var(--sans)}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sign :focus-visible{outline-color:var(--sign-fg)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;white-space:nowrap}
.prog{flex:none}
.citysel{width:auto;min-width:0;flex-shrink:1;text-overflow:ellipsis;max-width:100%;min-height:44px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:17px;padding:0 4px}
.prog{display:flex;flex-direction:column;gap:5px;align-items:flex-end;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{width:92px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--fg);border-radius:2px}

.themebtn{flex:none;width:44px;height:44px;border:1.5px solid var(--line);border-radius:22px;background:var(--panel);color:var(--fg);font-size:19px;line-height:1;cursor:pointer;padding:0}
@media (min-width:481px){#progress::after{content:" shot"}}
@media (max-width:480px){.track{display:none}}
.views{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;background:var(--line);border-radius:10px}
.views button{min-height:42px;border:0;border-radius:8px;background:transparent;color:var(--fg);font-weight:600;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.views button[aria-selected="true"]{background:var(--panel)}

.now{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.now-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.now-main b{font-size:17px}
.now-main span{font-size:13px;color:var(--muted)}
.now select{width:auto;min-width:118px}
.now .chip{grid-column:1/-1;justify-content:center}
.adjust{border:1px solid var(--yellow);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.adjust ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px;max-width:62ch}
.filters{display:flex;flex-direction:column;gap:10px}
.intents{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.intents::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:22px;background:var(--panel);color:var(--fg);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.selects{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
select{width:100%;min-height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font-weight:500;font-size:16px}

.sign{background:var(--sign);color:var(--sign-fg);border-radius:10px;border:1px solid var(--sign-line);overflow:hidden;display:flex;flex-direction:column}
.sign .label{color:var(--sign-muted)}
.band{height:7px}
.sign-head{padding:16px 20px 14px;display:flex;flex-direction:column;gap:10px}
.sign-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.intent-tag{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.where{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:14px;color:var(--sign-muted)}
.group .where{color:var(--muted)}
.where{gap:4px}
.bullet{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--on-color);flex:none}
.sign h2{font-size:clamp(28px,7.5vw,42px);line-height:1.04;letter-spacing:-.02em;margin:0;text-wrap:balance}
.tabs{display:flex;border-top:1px solid var(--sign-line);border-bottom:1px solid var(--sign-line)}
.tabs button{flex:1;min-width:0;min-height:46px;padding:0 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--sign-muted);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--sign-fg);border-bottom-color:var(--sign-fg)}
.pane{padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px}
.part{display:flex;flex-direction:column;gap:3px;min-width:0}
.part p,.plain{margin:0;font-size:17px;max-width:62ch}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:600px){.split{grid-template-columns:1fr 1fr;align-items:start}}
.times{display:flex;gap:6px;flex-wrap:wrap}
.time{font-size:13px;padding:3px 9px;border:1px solid var(--sign-line);border-radius:12px;color:var(--sign-muted)}
.jumps{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:600px){.jumps{grid-template-columns:repeat(3,1fr)}}
.jump{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:1px solid var(--sign-line);border-radius:8px;background:none;color:var(--sign-fg);font-size:15px;font-weight:600;text-align:left;cursor:pointer;min-width:0}
.jump small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sign-muted)}
.jump .mono{font-family:var(--mono);font-size:14px}
.jump .go{color:var(--sign-muted);font-size:20px}
.sign select{background:var(--sign);color:var(--sign-fg);border-color:var(--sign-line)}
.vals{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:15px;color:var(--sign-muted);max-width:62ch}
.setup{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px}
@media (max-width:620px){.setup{grid-template-columns:1fr 1fr}}
.setup button{display:flex;flex-direction:column;gap:1px;min-width:0;background:none;border:0;padding:4px 0;color:inherit;font-size:16px;text-align:left;cursor:pointer;border-radius:4px}
.setup button .label,.tipbtn{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--sign-muted)}
.setup .label{font-size:11px}
.setup button[aria-expanded="true"] .label{color:var(--sign-fg)}
.setup span:last-child{font-size:15px;font-weight:600}
.tipbtn{background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer}
.tip{margin:0;padding:10px 12px;border:1px solid var(--sign-line);border-radius:6px;font-size:15px;max-width:62ch}
.tip b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sign-muted);margin-bottom:2px}
.part .tip{margin-top:6px;font-size:15px}
.hint{font-size:12px;color:var(--sign-muted);margin:0}

.demo{margin:0;display:flex;flex-direction:column;gap:5px}
.demo-svg{width:100%;max-width:360px;height:auto;display:block;background:var(--sign)}
.demo figcaption{font-size:13px;color:var(--sign-muted);max-width:44ch}
.d-fg{fill:var(--sign-fg)} .d-mu{fill:var(--sign-muted)} .d-bg{fill:var(--sign-line)} .d-hole{fill:var(--sign)}
.d-you{fill:var(--yellow)} .d-cone{fill:var(--yellow);opacity:.22}
.d-ln{fill:none;stroke:var(--sign-muted);stroke-width:1.5}
.d-dash{fill:none;stroke:var(--sign-muted);stroke-width:1;stroke-dasharray:3 3}
.d-out{fill:none;stroke:var(--sign-fg);stroke-width:1.5;stroke-dasharray:3 2}
.d-frame{fill:none;stroke:var(--sign-fg);stroke-width:2} .d-edge{fill:none;stroke:var(--sign-line);stroke-width:2}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:728px;margin:0 auto;display:grid;grid-template-columns:52px 2fr 1fr 1fr;gap:8px}
.btn{min-height:52px;min-width:0;border-radius:8px;border:1.5px solid var(--fg);background:var(--bg);color:var(--fg);font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn[aria-pressed="true"]{background:var(--line);border-color:var(--line)}
.btn:disabled{opacity:.35;cursor:default}

.list{display:flex;flex-direction:column;gap:12px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.group-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.group-head b{font-size:17px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font-size:16px;text-align:left;cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block}
.row .t span{font-size:13px;color:var(--muted)}
.row.done .t b{text-decoration:line-through;color:var(--muted)}
.marks{display:flex;gap:4px;flex:none}
.when .pill{display:inline-block;vertical-align:middle;margin-left:4px;font-weight:700}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.row .go{color:var(--muted);font-size:20px;flex:none}
.lead{margin:0;font-size:14px;color:var(--muted);max-width:60ch}
.event{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.event summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;min-height:64px}
.event summary::-webkit-details-marker{display:none}
.cal{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;line-height:1.1;font-variant-numeric:tabular-nums}
.cal small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.cal b{font-size:24px}
.event .t{flex:1;min-width:0}
.event .t b{display:block;font-size:17px;line-height:1.2}
.event .t span{font-size:13px;color:var(--muted)}
.soon{flex:none;font-size:12px;font-weight:700;color:var(--muted);text-align:right;max-width:76px}
.soon.near{color:var(--fg)}
.event-body{padding:4px 14px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.event-body p{margin:0;max-width:62ch}
.event-body .when{font-weight:700;padding-top:12px}
.event-body .when span{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.eideas{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.eideas li{display:flex;flex-direction:column;gap:2px}
.eideas .tag{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eideas .tag .dot{width:10px;height:10px}
.eideas b{font-size:16px}
.eideas .set{font-family:var(--mono);font-size:13px;color:var(--muted)}
.check{color:var(--fg);font-weight:600;font-size:15px}
.empty{color:var(--muted);padding:24px 0;margin:0;max-width:50ch}
footer{font-size:13px;color:var(--muted);max-width:65ch}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Shot List</h1>
      <label class="label" for="city" hidden>City</label><select id="city" class="citysel" aria-label="City"></select>
    </div>
    <div class="prog"><span id="progress"></span><span class="track"><i id="fill"></i></span></div>
    <button type="button" class="themebtn" id="theme"></button>
  </header>

  <nav class="views" id="views" role="tablist" aria-label="View">
    <button type="button" role="tab" data-v="shoot" id="vShoot">Shoot</button>
    <button type="button" role="tab" data-v="browse" id="vBrowse">Browse</button>
    <button type="button" role="tab" data-v="saved" id="vSaved">Saved</button>
    <button type="button" role="tab" data-v="events" id="vEvents">Events</button>
  </nav>

  <section class="now" id="now" aria-label="Conditions now">
    <div class="now-main"><b id="nowHead"></b><span id="nowSub"></span></div>
    <select id="cond" aria-label="Conditions">
      <option value="auto">Auto</option><option value="sun">Bright sun</option><option value="cloud">Overcast</option><option value="rain">Rain</option><option value="fog">Fog</option><option value="snow">Snow</option><option value="dusk">Dusk</option><option value="night">Night</option>
    </select>
    <button type="button" class="chip" id="useLight" aria-pressed="false"></button>
  </section>

  <section class="filters" id="filters" aria-label="Filters">
    <div class="intents" id="intents"></div>
    <div class="selects">
      <div class="field"><label class="label" for="place">Place</label><select id="place"></select></div>
      <div class="field"><label class="label" for="when">Light</label><select id="when"></select></div>
    </div>
  </section>

  <main id="viewShoot"><article class="sign" id="card" aria-live="polite"></article></main>
  <main id="viewList" hidden><div class="list" id="list"></div></main>
  <main id="viewEvents" hidden><div class="list" id="events"></div></main>

  <footer>Subway photography is allowed by MTA rules without flash, tripods or lights. Diagrams are schematic. Saved and shot marks are kept on this device only. Weather data by Open-Meteo.com.</footer>
</div>

<div class="bar" id="bar"><div class="bar-in">
  <button class="btn" id="back" type="button" aria-label="Previous idea">‹</button>
  <button class="btn primary" id="next" type="button">Another idea</button>
  <button class="btn" id="save" type="button" aria-pressed="false">Save</button>
  <button class="btn" id="done" type="button" aria-pressed="false">Shot it</button>
</div></div>

<script>
const INTENTS = {
  place:  {name:"Show the place",        color:"var(--blue)"},
  moment: {name:"Capture a moment",      color:"var(--red)"},
  energy: {name:"Show energy",           color:"var(--orange)"},
  mood:   {name:"Create a mood",         color:"var(--purple)"},
  odd:    {name:"Find something unusual",color:"var(--yellow)"}
};
/* Cities. Adding a city means adding one entry here (its places, and optionally its
   transit line colours) plus idea rows below that use the new place ids.
   Place ids must be unique across all cities. `lines` values are a colour token name or a hex colour. */
const CITIES = {
 nyc:{name:"New York City",lat:40.7128,lon:-74.006,
  lines:{A:"blue",C:"blue",E:"blue",B:"orange",D:"orange",F:"orange",M:"orange",N:"yellow",Q:"yellow",R:"yellow",W:"yellow",
  "1":"red","2":"red","3":"red","4":"green","5":"green","6":"green","7":"purple",J:"brown",Z:"brown",S:"gray"},
  places:{
  chinatown:{name:"Chinatown", stop:"Canal St", lines:"NQRW6JZ"},
  gct:{name:"Grand Central", stop:"Grand Central–42 St", lines:"4567S"},
  tsq:{name:"Times Square", stop:"Times Sq–42 St", lines:"1237NQRW"},
  wsp:{name:"Washington Square", stop:"W 4 St–Wash Sq", lines:"ACEBDFM"},
  dumbo:{name:"DUMBO", stop:"York St", lines:"F"},
  coney:{name:"Coney Island", stop:"Stillwell Av", lines:"DFNQ"},
  soho:{name:"SoHo", stop:"Prince St", lines:"RW"},
  jh:{name:"Jackson Heights", stop:"74 St–Broadway", lines:"7EFMR"},
  ferry:{name:"Staten Island Ferry", stop:"South Ferry", lines:"1RW"},
  subway:{name:"On the subway", stop:"Any station", lines:""}
 }}
};
const PLACES = {};
for(const [cid,c] of Object.entries(CITIES)) for(const [pid,p] of Object.entries(c.places)) PLACES[pid] = Object.assign({city:cid},p);
const WHEN = {am:"Morning", mid:"Midday sun", gold:"Late afternoon", night:"Night", rain:"Rain or overcast"};

/* Camera profiles. Each idea names a recipe; the profile turns it into settings.
   Adding a camera means adding one entry here. */
// Per recipe: [focus mode, focus area, metering, exposure compensation], in Leica Q3 menu terms.
const SETUP = {
  // then [scene mode / exposure mode, aspect ratio, shutter type, white balance]
  zone:["MF","Not used (focus ring pre-set)","Multi-Field","0, or −0.3 in hard sun","Off · M with Auto ISO","3:2","Hybrid","Auto"],
  freeze:["AFc","Eye/Face/Body Detection","Multi-Field","0","Off · M with Auto ISO","3:2","Mechanical (no skew on fast movement)","Auto"],
  drag:["AFs","Field, on the still subject","Multi-Field","0","Off · S (shutter priority)","3:2","Mechanical","Auto"],
  deep:["AFs","Field, a third of the way into the scene","Multi-Field","0, or −0.3 to hold the sky","Off · A (aperture priority)","3:2, or 16:9 for a skyline","Hybrid","Auto, or Daylight to keep a set consistent"],
  shallow:["AFs","Eye/Face Detection","Center-Weighted","0, or +0.3 if the face is backlit","Off · A (aperture priority)","3:2","Hybrid (wide open in sun needs the electronic range)","Auto"],
  night:["AFs","Field, on a lit edge or sign","Multi-Field","−0.7","Off · M with Auto ISO","3:2","Mechanical (LED screens can band with electronic)","Daylight, so neon keeps its colour"],
  silhouette:["AFs","Field, on the edge of the figure","Multi-Field","−1.3","Off · A (aperture priority)","3:2","Hybrid","Daylight, to keep the warmth"],
  interior:["AFs","Field","Center-Weighted","0","Off · M with Auto ISO","3:2","Mechanical (artificial light can band with electronic)","Auto"],
  detail:["AFs","Spot","Multi-Field","0","Off · A (aperture priority)","3:2, or 1:1 for a single sign","Mechanical","Auto"]
};
const SETUP_LABELS = ["Focus mode","Focus area","Metering","Exposure comp.","Scene mode","Aspect ratio","Shutter type","White balance"];
// Explanations shown when a setting is tapped. Index matches SETUP_LABELS; "exp" is the aperture/shutter/ISO line.
const TIPS = {
  exp:["Aperture · shutter · ISO","Aperture (f-number) sets how much of the scene is sharp front to back: f/2 blurs the background, f/8 keeps most of it sharp. Shutter speed sets how movement looks: 1/500 s freezes walkers, 1/15 s blurs them. ISO is the sensor's sensitivity; Auto ISO lets the camera raise it so your aperture and shutter stay where you put them."],
  0:["Focus mode","How the camera focuses. AFs locks focus once when you half-press, which suits still subjects. AFc keeps refocusing while you hold, which suits people moving toward or away from you. MF means you set the distance yourself on the lens ring, so there is no delay when you press."],
  1:["Focus area","Where in the frame the camera looks for focus. Field is one movable box you place on the subject. Spot is a smaller box for precise targets. Eye/Face/Body Detection finds a person and follows them. Multi-Field lets the camera choose, which is fast but can pick the wrong thing in a crowd."],
  2:["Metering","How the camera measures brightness to set exposure. Multi-Field averages the whole frame and is right most of the time. Center-Weighted favours the middle, useful when the subject is central and the edges are much brighter or darker. Spot reads one small point. Highlight-Weighted protects the brightest areas from blowing out."],
  3:["Exposure compensation","Tells the camera to make the picture brighter (+) or darker (−) than its meter suggests. Use minus when bright lights or sky are being washed out, and plus when a backlit face comes out too dark. It only has an effect when the camera is choosing at least one of shutter, aperture or ISO."],
  4:["Scene mode","Scene modes are presets, such as Sport or Portrait, where the camera picks every exposure setting. They are off here so the settings on this card apply. The letter is the exposure mode to use instead: A means you set aperture and the camera sets shutter, S means you set shutter, M means you set both."],
  5:["Aspect ratio","The shape of the picture. 3:2 uses the whole sensor. 16:9 is wider and suits skylines; 1:1 is square and suits a single centred subject. Choosing another ratio shows crop lines while you frame."],
  6:["Shutter type","Mechanical is a physical shutter: reliable under artificial light and with fast movement, up to 1/2000 s. Electronic is silent and much faster, but can bend fast-moving subjects and show dark bands under LED or fluorescent light. Hybrid uses mechanical normally and switches to electronic only when the light needs a faster speed."],
  7:["White balance","Sets the overall colour cast so whites look white. Auto adjusts for each scene. Daylight is fixed, so warm light stays warm and neon keeps its colour, and every frame in a set matches. With DNG files you can change it afterwards without losing quality."]
};

}

  space:["Negative space","Leave most of the frame empty and keep the subject small. Emptiness gives quiet, loneliness or a sense of scale."],
  sym:["Symmetry","Centre the subject and balance both halves. It only works when it is exact, so keep the camera level and square to the scene."],
  fill:["Fill the frame","Get close enough that nothing irrelevant is left. If something does not help the picture, remove it by stepping in."],
  thirds:["Rule of thirds","Imagine the frame divided into three each way and put the subject on a line or a crossing, not in the centre. Leave room in the direction it faces or moves."],

function eventNext(ev, today){
  for(const y of [today.getFullYear(), today.getFullYear()+1]){

    if(occ.length) return occ[0];
  }
  return null;
}
function eventSoon(o, today){
  if(o[0]<=today) return "On now";
  const n=Math.round((o[0]-today)/864e5);
  if(n===0) return "Today"; if(n===1) return "Tomorrow"; if(n<14) return "In "+n+" days"; if(n<70) return "In "+Math.round(n/7)+" weeks"; return "In "+Math.round(n/30.4)+" months";
}

    const j=await r.json(), cur=j.current||{}, txt=WMO(cur.weather_code);
    if(typeof cur.temperature_2m==="number" && txt){
      WEATHER[id]={updated:new Date().toISOString(),temp_c:cur.temperature_2m,condition:txt,condition_text:txt,is_day:!!cur.is_day,
        precip_chance_today:j.daily&&j.daily.precipitation_probability_max?j.daily.precipitation_probability_max[0]:undefined};
      store.set("weather",WEATHER);
    }
  }catch(e){} finally{ weatherBusy=false; }
  renderNow(); if(state.view==="shoot"&&state.tab==="settings"&&openTip===null&&document.activeElement.id!=="camera") renderCard();
}
loadWeather(); setInterval(loadWeather, 15*60*1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ const w=WEATHER[state.city]; if(!w||Date.now()-new Date(w.updated)>10*60*1000) loadWeather(); } });
$("city").addEventListener("change",loadWeather);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
function render(){
  openTip=null;
  const shoot=state.view==="shoot", ev=state.view==="events";
  $("viewShoot").hidden=!shoot; $("viewList").hidden=shoot||ev; $("viewEvents").hidden=!ev; $("bar").hidden=!shoot; $("filters").hidden=ev; $("now").hidden=ev; renderNow();
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===state.view));
  const all=cityIdeas(), n=all.filter(x=>state.done.has(x.id)).length;
  $("progress").textContent=n+"/"+all.length; $("progress").setAttribute("aria-label",n+" of "+all.length+" ideas shot"); $("fill").style.width=(all.length?100*n/all.length:0)+"%";
  if(shoot) renderCard(); else if(ev) renderEvents(); else renderList();
}
function refilter(){ if(!matches(false).some(x=>x.id===state.current)) pick(); render(); }
function cardToTop(){ const r=$("card").getBoundingClientRect(); if(r.top<0) window.scrollTo({top:window.scrollY+r.top-12,behavior:"smooth"}); }

// Controls
$("intents").innerHTML = '<button type="button" class="chip" data-i="all">Any intent</button>' + Object.entries(INTENTS).map(([k,v])=>
  '<button type="button" class="chip" data-i="'+k+'"><span class="dot" style="background:'+v.color+'"></span>'+v.name+'</button>').join("");
function syncChips(){ document.querySelectorAll("#intents .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.i===state.intent)); }
$("intents").addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return;
  state.intent=c.dataset.i; store.set("intent",state.intent); syncChips(); refilter(); });
function fill(sel,all,obj,val){ sel.innerHTML=(all?'<option value="all">'+all+'</option>':'')+Object.entries(obj).map(([k,v])=>'<option value="'+k+'">'+esc(v.name||v)+'</option>').join(""); sel.value=val; if(!sel.value) sel.selectedIndex=0; }
fill($("city"),"",CITIES,state.city);
const fillPlaces = () => fill($("place"),"Anywhere",CITIES[state.city].places,state.place);
fillPlaces(); fill($("when"),"Any light",WHEN,state.when);
$("city").addEventListener("change",e=>{state.city=e.target.value;state.place="all";state.history=[];store.set("city",state.city);store.set("place","all");fillPlaces();refilter();});
$("place").addEventListener("change",e=>{state.place=e.target.value;store.set("place",state.place);refilter();});
$("when").addEventListener("change",e=>{state.when=e.target.value;store.set("when",state.when);refilter();});
$("cond").addEventListener("change",e=>{state.cond=e.target.value;render();});
$("useLight").addEventListener("click",e=>{const k=e.currentTarget.dataset.k; state.when=state.when===k?"all":k; store.set("when",state.when); $("when").value=state.when; refilter();});
setInterval(()=>{ try{ renderNow(); }catch(e){} }, 300000);
// Day and night view. With no saved choice the page follows the device setting.
const rootEl=document.documentElement;
const isDark=()=>{ const a=rootEl.getAttribute("data-theme"); return a ? a==="dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); };
function syncTheme(){ const d=isDark(); $("theme").textContent=d?"☼":"☾"; $("theme").setAttribute("aria-label",d?"Switch to day view":"Switch to night view"); $("theme").title=d?"Day view":"Night view"; }
{ const t=store.get("theme",null); if(t==="dark"||t==="light") rootEl.setAttribute("data-theme",t); }
$("theme").addEventListener("click",()=>{ const next=isDark()?"light":"dark"; rootEl.setAttribute("data-theme",next); store.set("theme",next); syncTheme(); });
syncTheme();
$("views").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; state.view=b.dataset.v; render();});
$("next").addEventListener("click",()=>{pick();render();cardToTop();});
$("back").addEventListener("click",()=>{ const id=state.history.pop(); if(!id) return; state.current=id; state.tab="idea"; render(); cardToTop(); });
function toggle(set,key){ if(!state.current) return; set.has(state.current)?set.delete(state.current):set.add(state.current); store.set(key,[...set]); render(); }
$("save").addEventListener("click",()=>toggle(state.saved,"saved"));
$("done").addEventListener("click",()=>toggle(state.done,"done"));
$("list").addEventListener("click",e=>{const r=e.target.closest(".row"); if(!r) return; show(r.dataset.id); state.view="shoot"; render(); window.scrollTo({top:0});});
$("card").addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]"); if(t){ state.tab=t.dataset.tab; openTip=null; renderCard(); return; }
  const b=e.target.closest("[data-tip]"); if(b){ openTip = openTip===b.dataset.tip ? null : b.dataset.tip; renderCard(); }
});
$("card").addEventListener("change",e=>{ if(e.target.id==="camera"){ state.camera=e.target.value; store.set("camera",state.camera); openTip=null; renderCard(); } });

syncChips(); pick(); state.history=[]; render();
</script>

</body>
</html>
